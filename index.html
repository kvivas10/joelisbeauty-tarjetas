<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de tarjetas · Joelis Beauty</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,sans-serif;background:linear-gradient(160deg,#fff4f9,#f3e6ff);min-height:100vh;display:grid;place-items:center;padding:20px;color:#3b2340}
.box{background:#fff;border-radius:24px;padding:30px;max-width:480px;width:100%;box-shadow:0 15px 50px #b983ff33}
h1{font-family:'Playfair Display',serif;color:#ff5fa2;margin-bottom:4px}
p.s{font-weight:300;margin-bottom:20px}
label{display:block;font-size:.8rem;margin:14px 0 6px;color:#b983ff;text-transform:uppercase;letter-spacing:.1em}
input,select{width:100%;padding:13px 16px;border-radius:14px;border:2px solid #f0dbff;font:inherit}
input:focus,select:focus{outline:0;border-color:#ff5fa2}
.out{margin-top:18px;padding:12px;background:#fff4f9;border-radius:14px;font-size:.8rem;word-break:break-all}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button,a.b{flex:1;padding:13px;border-radius:999px;border:2px solid #ff5fa2;background:#ff5fa2;color:#fff;font:inherit;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;min-width:130px}
button.g{background:#fff;color:#ff5fa2}
.f[hidden]{display:none}
</style>
</head>
<body>
<div class="box">
  <h1>Joelis Beauty 💖</h1>
  <p class="s">Crea el enlace personalizado y envíalo a tu clienta.</p>
  <label>Tipo de tarjeta</label>
  <select id="m">
    <option value="promocion">Promoción</option>
    <option value="descuento">Descuento</option>
    <option value="sorteo">Sorteo</option>
    <option value="gratis">Gratis (regalo)</option>
    <option value="cumpleanos">Cumpleaños</option>
    <option value="cumpleanos-personalizado">Cumpleaños personalizado</option>
    <option value="ganadora">Ganadora sorteo</option>
  </select>
  <div class="f" id="f-n">
    <label>Nombre de la clienta</label>
    <input id="n" placeholder="Ej: María" autocomplete="off">
  </div>
  <div class="f" id="f-de">
    <label>De parte de (remitente)</label>
    <input id="de" placeholder="Si lo dejas vacío: Joelis Beauty" autocomplete="off">
  </div>
  <div class="f" id="f-p">
    <label>Descuento %</label>
    <input id="p" placeholder="" inputmode="numeric" maxlength="2" pattern="[0-9]*">
  </div>
  <div class="f" id="f-r">
    <label id="lr">Premio / regalo</label>
    <input id="r" placeholder="" autocomplete="off">
  </div>
  <div class="f" id="f-t">
    <label>WhatsApp de la clienta (opcional)</label>
    <input id="t" placeholder="573001112233" inputmode="numeric">
  </div>
  <div class="out" id="o"></div>
  <div class="btns">
    <button id="c">Copiar enlace</button>
    <a class="b g" id="v" target="_blank">Vista previa</a>
    <button id="w" class="g">Enviar por WhatsApp</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
/* Campos que aplican a cada tarjeta (n=nombre, de=remitente, p=descuento %, r=premio/regalo) */
const CAMPOS={
  'promocion':{n:1,p:'Si lo dejas vacío: 20%'},
  'descuento':{n:1,p:'Si lo dejas vacío: 20%'},
  'sorteo':{n:1,r:['Premio mayor del sorteo','Si lo dejas vacío: Set de uñas con diseño a tu elección']},
  'gratis':{n:1,r:['Regalo','Si lo dejas vacío: Tu próximo arreglo de uñas es totalmente GRATIS 💖']},
  'cumpleanos':{n:1,p:'Si lo dejas vacío: 20%',r:['Regalo (reemplaza el descuento)','Ej: Mantenimiento Gel + pedicura semi']},
  'cumpleanos-personalizado':{n:1,de:1,p:'Si lo dejas vacío: 20%',r:['Regalo (reemplaza el descuento)','Ej: Mantenimiento Gel + pedicura semi']},
  'ganadora':{n:1,r:['Premio ganado','Si lo dejas vacío: Set de uñas con diseño a tu elección']}
};
const cur=()=>CAMPOS[$('m').value];
function campos(){
  const c=cur();
  $('f-n').hidden=!c.n; $('f-de').hidden=!c.de; $('f-p').hidden=!c.p; $('f-r').hidden=!c.r;
  if(c.p)$('p').placeholder=c.p;
  if(c.r){$('lr').textContent=c.r[0];$('r').placeholder=c.r[1];}
}
function link(){
  const c=cur(), u=new URL('modelos/'+$('m').value+'.html',location.href);
  const n=$('n').value.trim(), de=$('de').value.trim(), p=$('p').value.replace(/D/g,'').slice(0,2), r=$('r').value.trim();
  if(c.n&&n)u.searchParams.set('nombre',n);
  if(c.de&&de)u.searchParams.set('de',de);
  if(c.p&&p)u.searchParams.set('desc',p);
  if(c.r&&r)u.searchParams.set('premio',r);
  const d=new Date();
  u.searchParams.set('d',d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
  return u.href;
}
function up(){campos();const l=link();$('o').textContent=l;$('v').href=l}
$('p').addEventListener('input',()=>{$('p').value=$('p').value.replace(/D/g,'').slice(0,2)});
['m','n','p','r','de'].forEach(i=>$(i).addEventListener('input',up));up();
$('c').onclick=async()=>{await navigator.clipboard.writeText(link());$('c').textContent='¡Copiado! ✨';setTimeout(()=>$('c').textContent='Copiar enlace',1500)};
$('w').onclick=()=>{
  const n=cur().n?$('n').value.trim():'',t=$('t').value.replace(/D/g,'');
  const msg=encodeURIComponent(`Hola ${n} 💖 Tenemos algo especial para ti en Joelis Beauty:
${link()}`);
  window.open(t?`https://wa.me/${t}?text=${msg}`:`https://wa.me/?text=${msg}`,'_blank');
};
</script>
</body>
</html>
